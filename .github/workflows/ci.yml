# yamllint disable rule:line-length
name: ci

# 0.2.0 is reserved for "runs on macOS the same way it does here". This workflow
# is what turns that into a measurable gate instead of a feeling: the two jobs
# below report, per push, which layers actually hold on each OS.
#
# What is proven here vs. what is not:
#   - The HTTP daemon boots and serves on both OSes: after the frontend build
#     (the daemon embeds it at compile time), a smoke step starts
#     `pc-ai-monitor-serve`, requires a real collected snapshot and the
#     compiled UI on `/`, and that it listens on 127.0.0.1 only. A binary that
#     crashes on boot or serves the placeholder cannot pass.
#   - The Rust parsers run on both OSes because their fixtures are synthetic
#     strings (`ports.rs` parses `ss` output and never reads /proc), so a green
#     macos test suite does NOT mean port collection works on macOS.
#   - Collection is the part that does not port: `ports.rs` shells out to `ss`
#     (Linux-only) and `collector.rs` shells out to the macacoview-* scripts, which
#     read /proc. Those need a macOS implementation before they can be gated.
#
# Deliberately absent: an npm publish / release job. There is no portable binary
# to package yet, and a half-working Mac artifact is worse than a red check that
# names what is missing.
#
# Third-party actions are pinned by commit SHA: a mutable version tag can be
# moved by whoever owns the repo, and this workflow runs with a GITHUB_TOKEN.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Linux: the platform the app runs on today. Everything here must be green.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: System deps (GTK 4 + libadwaita + PyGObject + Rust build headers)
        run: |
          sudo apt-get update
          # Runtime + typelibs for the Python/GTK tests. Names taken from
          # noble/main's own package list: the libadwaita runtime is
          # libadwaita-1-0 (not libadwaita-1) and the typelibs are gir1.2-adw-1
          # and gir1.2-gtk-4.0. A regex lookup here matched nothing twice, so
          # the names are stated plainly -- a missing one now says so by name.
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-1 libadwaita-1-0 gir1.2-adw-1 gir1.2-gtk-4.0 \
            python3-gi python3-gi-cairo xvfb
          # Build-time headers: the Tauri crate links glib/gobject/gio and the
          # WebKit stack. A machine that has compiled this for years (mine)
          # cannot show this gap; the runner can.
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-4-dev libadwaita-1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev \
            || echo "aviso: faltan headers de build, cargo test puede no compilar"
          python3 - <<'CHECK'
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Adw", "1")
          from gi.repository import Gtk, Adw  # noqa: F401
          print("gi: Gtk 4 + Adw disponibles")
          CHECK

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Rust toolchain (preinstalled on this runner image)
        run: rustc --version && cargo --version

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Test count floor (tests must not silently vanish)
        working-directory: src-tauri
        run: |
          # `cargo test` staying green says nothing about HOW MANY tests ran: a
          # module stranded behind a wrong cfg gate compiles to zero tests and
          # the suite stays green. 91 is the floor of the current suite (92 at
          # the time this was written), not an exact count: tests may be added
          # freely, they may never disappear.
          count=$(cargo test --lib -- --list | grep -c ': test$' || true)
          echo "lib tests on Linux: $count (floor 91)"
          if [ "$count" -lt 91 ]; then
            echo "FALLO: $count lib tests < 91: tests disappeared silently"
            exit 1
          fi

      - name: Frontend typecheck and build
        run: |
          npm ci
          npm run build

      # The daemon embeds the frontend at build time. When that path breaks, the
      # binary still compiles and the server still answers 200 -- it just serves a
      # placeholder page instead of the app. A green build proves nothing here, so
      # assert that the assets were actually embedded.
      - name: The daemon must embed the frontend, not serve the placeholder
        run: |
          cd src-tauri
          touch build.rs          # force the build script to re-run now dist/ exists
          cargo build 2>&1 | tee /tmp/embed.log
          grep -q "embedded .* frontend asset" /tmp/embed.log || {
            echo "FALLO: el daemon no incrusto el frontend; serviria el placeholder"
            exit 1
          }

      # Until this step existed, CI compiled the daemon but never ran it: a
      # crash on boot, an empty page or an unresponsive port reached the user
      # unseen. dist/ exists by now (the step above rebuilt with it), so run
      # the binary a user would run and hit the endpoints they would hit.
      - name: Boot the daemon and hit its endpoints
        run: |
          cd src-tauri
          touch build.rs          # dist/ appeared since the last build: re-embed
          cargo build --bin pc-ai-monitor-serve

          # Linux collection shells out to $HOME/.local/bin/macacoview-stats, which
          # only exists on an installed machine. Ship it there, or snapshot
          # stays null and this smoke would report a missing collector as a
          # broken daemon. No home literal: the daemon itself resolves $HOME.
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/scripts/macacoview-stats" "$HOME/.local/bin/macacoview-stats"
          chmod +x "$HOME/.local/bin/macacoview-stats"

          port=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          log=$(mktemp)
          state=$(mktemp)
          PC_AI_PORT="$port" target/debug/pc-ai-monitor-serve >"$log" 2>&1 &
          pid=$!
          # The daemon must die even if an assertion below fails: a process
          # left behind on the runner fails the job in confusing ways.
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT

          # Wait with retries and a deadline. "Ready" means the first
          # collection tick landed (snapshot non-null): it runs on a background
          # thread and can lose the race against the very first request. If the
          # collector is broken this times out and the daemon log below names
          # the failure. Every probe sits inside an `if` because Actions runs
          # this as plain `bash -e` on macOS.
          ready=""
          for _ in $(seq 1 60); do
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            if curl -fsS -o "$state" "http://127.0.0.1:$port/api/state" 2>/dev/null \
               && grep -q '"snapshot":{' "$state"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "FALLO: el daemon no arranco o el colector no produjo snapshot; salida del daemon:"
            cat "$log"
            exit 1
          fi
          echo "daemon arriba en 127.0.0.1:$port (pid $pid)"

          # /api/state: valid JSON, the documented keys, and a memory number
          # only a working collector on this machine can produce.
          python3 -c '
          import json
          import sys

          with open(sys.argv[1]) as fh:
              state = json.load(fh)
          for key in ("snapshot", "history"):
              if key not in state:
                  sys.exit("FALLO: /api/state no tiene la clave " + key)
          total = state["snapshot"]["memory"]["total_gib"]
          if not (isinstance(total, (int, float)) and total > 0):
              sys.exit("FALLO: snapshot.memory.total_gib = " + repr(total) + ": el colector no midio nada en esta maquina")
          print("api/state ok: history " + str(len(state["history"])) + " samples, memory.total_gib = " + str(total))
          ' "$state"

          # / : the real UI, not the placeholder. The placeholder also answers
          # 200 with HTML, so the status code alone proves nothing.
          page=$(mktemp)
          if ! curl -fsS -o "$page" "http://127.0.0.1:$port/"; then
            echo "FALLO: GET / no respondio 200; salida del daemon:"
            cat "$log"
            exit 1
          fi
          if ! grep -q '<script' "$page"; then
            echo "FALLO: GET / no contiene <script: sirve el placeholder, no la interfaz compilada"
            exit 1
          fi
          echo "GET / ok: la interfaz compilada, no el placeholder"

          # One-user daemon: localhost only, never exposed to the network.
          listen=$(lsof -nP -iTCP:"$port" -sTCP:LISTEN)
          echo "$listen"
          if ! echo "$listen" | grep -q "TCP 127.0.0.1:$port "; then
            echo "FALLO: el daemon no escucha en 127.0.0.1:$port"
            exit 1
          fi
          if echo "$listen" | grep -Eq 'TCP (\*|0\.0\.0\.0):'; then
            echo "FALLO: el daemon escucha en todas las interfaces; debe ser solo 127.0.0.1"
            exit 1
          fi
          echo "escucha solo en 127.0.0.1:$port"

      - name: Extension syntax
        run: node --check gui/gnome-extension/extension.js

      - name: Python tests (headless, under xvfb)
        working-directory: gui
        run: xvfb-run -a python3 -m unittest discover -s tests

  # macOS: the honest diagnostic. It compiles, runs the pure parsers, builds
  # the frontend and boots the daemon for an endpoint smoke. It keeps failing
  # on anything that still assumes Linux, and that failure is the list of work
  # left for 0.2.0.
  check-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Rust toolchain (preinstalled on this runner image)
        run: rustc --version && cargo --version

      - name: Rust tests (parsers only -- collection is not portable yet)
        working-directory: src-tauri
        run: cargo test

      - name: macOS must run more tests than Linux (gated smoke, not silently excluded)
        working-directory: src-tauri
        run: |
          # History: "ungate the pure macOS parsers" shipped with the gated
          # tests silently excluded and `cargo test` stayed green. The parser
          # tests are platform-independent, so the Linux job runs exactly
          # (total - smoke) of them. macOS must run strictly MORE than that
          # platform-independent baseline, which holds if and only if the
          # macOS-only smoke module actually compiled in. The count is derived
          # by subtraction from `--list`, so no constant is shared between jobs
          # and the bar grows on its own as tests are added anywhere.
          #
          # Known fragility: this greps the test list for the module path
          # (`macos::smoke::`). If someone renames the module, the grep drops
          # to 0 and this step fails loudly -- correct, if noisy. The weaker
          # direction is the dangerous one: macOS-only tests gated OUTSIDE the
          # smoke module are invisible to the subtraction, and the comparison
          # silently loses force without failing. Keep platform-gated tests in
          # the smoke module.
          total=$(cargo test --lib -- --list | grep -c ': test$' || true)
          smoke=$(cargo test --lib -- --list | grep -c 'macos::smoke::' || true)
          baseline=$((total - smoke))
          echo "lib tests on macOS: $total (macOS-only smoke: $smoke, Linux-equivalent baseline: $baseline)"
          if [ "$total" -le "$baseline" ]; then
            echo "FALLO: macOS runs $total tests, not more than the platform-independent baseline ($baseline): the macOS-only tests did not compile in"
            exit 1
          fi

      - name: Frontend typecheck and build
        run: |
          npm ci
          npm run build

      # Same daemon smoke as the Linux job. No collector to install here:
      # macOS collection is native (sysctl/vm_stat/ps), it needs nothing
      # outside this checkout.
      - name: Boot the daemon and hit its endpoints
        run: |
          cd src-tauri
          touch build.rs          # dist/ appeared since the last build: re-embed
          cargo build --bin pc-ai-monitor-serve

          port=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          log=$(mktemp)
          state=$(mktemp)
          PC_AI_PORT="$port" target/debug/pc-ai-monitor-serve >"$log" 2>&1 &
          pid=$!
          # The daemon must die even if an assertion below fails: a process
          # left behind on the runner fails the job in confusing ways.
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT

          # Wait with retries and a deadline. "Ready" means the first
          # collection tick landed (snapshot non-null): it runs on a background
          # thread and can lose the race against the very first request. If the
          # collector is broken this times out and the daemon log below names
          # the failure. Every probe sits inside an `if` because Actions runs
          # this step as plain `bash -e`.
          ready=""
          for _ in $(seq 1 60); do
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            if curl -fsS -o "$state" "http://127.0.0.1:$port/api/state" 2>/dev/null \
               && grep -q '"snapshot":{' "$state"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "FALLO: el daemon no arranco o el colector no produjo snapshot; salida del daemon:"
            cat "$log"
            exit 1
          fi
          echo "daemon arriba en 127.0.0.1:$port (pid $pid)"

          # /api/state: valid JSON, the documented keys, and a memory number
          # only a working collector on this machine can produce.
          python3 -c '
          import json
          import sys

          with open(sys.argv[1]) as fh:
              state = json.load(fh)
          for key in ("snapshot", "history"):
              if key not in state:
                  sys.exit("FALLO: /api/state no tiene la clave " + key)
          total = state["snapshot"]["memory"]["total_gib"]
          if not (isinstance(total, (int, float)) and total > 0):
              sys.exit("FALLO: snapshot.memory.total_gib = " + repr(total) + ": el colector no midio nada en esta maquina")
          print("api/state ok: history " + str(len(state["history"])) + " samples, memory.total_gib = " + str(total))
          ' "$state"

          # / : the real UI, not the placeholder. The placeholder also answers
          # 200 with HTML, so the status code alone proves nothing.
          page=$(mktemp)
          if ! curl -fsS -o "$page" "http://127.0.0.1:$port/"; then
            echo "FALLO: GET / no respondio 200; salida del daemon:"
            cat "$log"
            exit 1
          fi
          if ! grep -q '<script' "$page"; then
            echo "FALLO: GET / no contiene <script: sirve el placeholder, no la interfaz compilada"
            exit 1
          fi
          echo "GET / ok: la interfaz compilada, no el placeholder"

          # One-user daemon: localhost only, never exposed to the network.
          listen=$(lsof -nP -iTCP:"$port" -sTCP:LISTEN)
          echo "$listen"
          if ! echo "$listen" | grep -q "TCP 127.0.0.1:$port "; then
            echo "FALLO: el daemon no escucha en 127.0.0.1:$port"
            exit 1
          fi
          if echo "$listen" | grep -Eq 'TCP (\*|0\.0\.0\.0):'; then
            echo "FALLO: el daemon escucha en todas las interfaces; debe ser solo 127.0.0.1"
            exit 1
          fi
          echo "escucha solo en 127.0.0.1:$port"

      - name: Record which layer is still Linux-only
        run: |
          # ss and /proc do not exist here. This step documents the gap instead
          # of pretending the collectors work, so a red run names the missing
          # piece rather than a stack trace.
          python3 - <<'PY'
          import pathlib
          import sys

          stats = pathlib.Path("scripts/macacoview-stats").read_text()
          if "/proc" not in stats:
              sys.exit("macacoview-stats no longer reads /proc: update this")
          print("expected: macacoview-stats is Linux-only and needs a macOS sibling")
          PY

  # A machine that is not mine: install into a fresh user and require real data.
  # The check job above cannot catch this class of bug -- it never runs install.sh,
  # which is exactly how the app shipped without its three collectors.
  install-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-1 libadwaita-1-0 gir1.2-adw-1 gir1.2-gtk-4.0 \
            python3-gi python3-gi-cairo xvfb

      - name: Install as a user with no prior state
        run: |
          sudo useradd -m -s /bin/bash friend
          # The workspace belongs to the runner user and is not readable by other
          # accounts, so installing from it as a second user fails on the first cp.
          # Copy the sources to a world-readable place, as a release tarball would be.
          sudo cp -a "$GITHUB_WORKSPACE" /tmp/pcai-src
          sudo chmod -R a+rX /tmp/pcai-src
          sudo -u friend -H bash /tmp/pcai-src/gui/install.sh

      - name: The app must find its collectors and report data
        run: |
          out=$(sudo -u friend -H env PYTHONPATH=/home/friend/.local/lib/macacoview \
              xvfb-run -a python3 -m pc_ai_monitor --self-test 2>&1)
          echo "$out"
          echo "$out" | grep -q "errores ninguno" || { echo "FALLO: la app no consiguio datos"; exit 1; }
          echo "$out" | grep -q "stats True" || { echo "FALLO: macacoview-stats no encontrado"; exit 1; }
          pill=$(sudo -u friend -H /home/friend/.local/bin/macacoview-bar --pill 2>&1 || true)
          echo "pill: $pill"

      - name: Config must not contain the runner's home path
        run: |
          cfg=$(sudo -u friend -H cat /home/friend/.config/macacoview/config.toml)
          echo "$cfg" | grep -q "/home/runner" && { echo "FALLO: el template embebe la ruta del builder"; exit 1; }
          echo "  config sin rutas de otra maquina"
