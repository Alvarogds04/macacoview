# yamllint disable rule:line-length
name: ci

# 0.2.0 is reserved for "runs on macOS the same way it does here". This workflow
# is what turns that into a measurable gate instead of a feeling: the two jobs
# below report, per push, which layers actually hold on each OS.
#
# What is proven here vs. what is not:
#   - The Rust parsers run on both OSes because their fixtures are synthetic
#     strings (`ports.rs` parses `ss` output and never reads /proc), so a green
#     macos test suite does NOT mean port collection works on macOS.
#   - Collection is the part that does not port: `ports.rs` shells out to `ss`
#     (Linux-only) and `collector.rs` shells out to the pc-ai-* scripts, which
#     read /proc. Those need a macOS implementation before they can be gated.
#
# Deliberately absent: an npm publish / release job. There is no portable binary
# to package yet, and a half-working Mac artifact is worse than a red check that
# names what is missing.
#
# Third-party actions are pinned by commit SHA: a mutable version tag can be
# moved by whoever owns the repo, and this workflow runs with a GITHUB_TOKEN.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Linux: the platform the app runs on today. Everything here must be green.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: System deps (GTK 4 + libadwaita + PyGObject)
        run: |
          sudo apt-get update
          # `libadwaita-1` does not exist: the runtime is `libadwaita-1-0`. The
          # typelib package names are resolved here instead of guessed, because
          # Ubuntu 24.04 does not carry them under the Debian names.
          apt_cache=$(dpkg -S libadwaita 2>/dev/null | cut -d: -f1 | sort -u | tr '\n' ' ')
          echo "paquetes libadwaita instalables: ${apt_cache}"
          typelib_adw=$(apt-cache --no-generics -R '^gir1\\.2-adw' show | awk -F': ' '/^Package/{print $2}' | head -1)
          typelib_gtk=$(apt-cache --no-generics -R '^gir1\\.2-gtk-4' show | awk -F': ' '/^Package/{print $2}' | head -1)
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-1 libadwaita-1-0 python3-gi python3-gi-cairo xvfb
          for pkg in "$typelib_adw" "$typelib_gtk"; do
            [ -n "$pkg" ] && sudo apt-get install -y --no-install-recommends "$pkg"
          done

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Rust toolchain (preinstalled on this runner image)
        run: rustc --version && cargo --version

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Frontend typecheck and build
        run: |
          npm ci
          npm run build

      - name: Extension syntax
        run: node --check gui/gnome-extension/extension.js

      - name: Python tests (headless, under xvfb)
        working-directory: gui
        run: xvfb-run -a python3 -m unittest discover -s tests

  # macOS: the honest diagnostic. It compiles, runs the pure parsers and builds
  # the frontend. It keeps failing on anything that still assumes Linux, and
  # that failure is the list of work left for 0.2.0.
  check-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Rust toolchain (preinstalled on this runner image)
        run: rustc --version && cargo --version

      - name: Rust tests (parsers only -- collection is not portable yet)
        working-directory: src-tauri
        run: cargo test

      - name: Frontend typecheck and build
        run: |
          npm ci
          npm run build

      - name: Record which layer is still Linux-only
        run: |
          # ss and /proc do not exist here. This step documents the gap instead
          # of pretending the collectors work, so a red run names the missing
          # piece rather than a stack trace.
          python3 - <<'PY'
          import pathlib
          import sys

          stats = pathlib.Path("scripts/pc-ai-stats").read_text()
          if "/proc" not in stats:
              sys.exit("pc-ai-stats no longer reads /proc: update this")
          print("expected: pc-ai-stats is Linux-only and needs a macOS sibling")
          PY
