[package]
name = "pc-ai-monitor"
version = "0.1.0"
description = "PC-AI Monitor"
edition = "2021"

[lib]
name = "pc_ai_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Standalone single-binary daemon: serves the dashboard over HTTP on
# 127.0.0.1 without Tauri, Node or Python. Port comes from PC_AI_PORT
# (default 8787).
[[bin]]
name = "macacoview-serve"
path = "src/bin/serve.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
toml = "1.1.6"
# Editing `[[watch]]` in the shared config.toml while preserving every other
# section, its formatting and its comments. The daemon's POST /api/config uses
# it; a plain `toml` round-trip would silently drop the user's comments.
toml_edit = "0.25"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
