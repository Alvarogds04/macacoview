<!doctype html>
<!--
  MacacoView · 06 Cabina combinada — which element comes from which source artboard.

  FROM 01 (cabina densa — shell and exact values)
    - 168 px sidebar with the small live badges (engine name, free RAM, router %, exposed ports count),
      the headerbar with the «Motores» title, the Gentle palette (theme.py variables) and the #icon symbols.
    - Update card field rows: tag, revisión, contexto servido (+ the 'coincide' check).
    - Engines inventory rows (gufo / abito / embed-small): lamp, ctx, port, power button.
    - Recursos: the 5-minute RAM sparkline under the treemap.
    - Procesos: the sortable table (column headers are sort buttons), reduced to name + RAM + CPU.
  FROM 04 (medidores — instruments for "now")
    - Engines as memory blocks inside the 122 GiB RAM bar, with the ⇄ switch button + «Ctrl E».
    - Rings for prompt cache and KV window, small MTP dial, GPU lamp, requests-in-flight dots.
    - Version rail «b6532 ● ┄ ○ b6587» + update button «Ctrl U»; 4-dot stepper; ctx equality bars.
    - Status lamps with shape + colour (ok circle green, stale diamond amber, down square red).
    - Age pill in the headerbar; loading ring sweep; confirmation dialog layout (RAM blocks before → after, ctx 131k → 65k).
    - Recursos treemap; Router session dots; Puertos exposed/local colouring (globe vs lock).
  FROM 05 (línea de tiempo — time)
    - 15-minute motor state band with focusable event markers (⇄ switch 13:57, ✕ Abito crash 13:52, ↑ b6587 available),
      striped restart segment, hatched ≈ 85 s gap, projected future in the confirmation, ↺ rollback marker.
    - Decode and prefill as two area lanes on one 15-min axis with a shared cursor (hover / keyboard / event click
      moves it on the band and on both lanes; frozen at 14:03 in the static board); current value big at the right end.
    - «sin datos» dashed tail on stale lanes, pulsing cursor while loading, empty lanes.
    - Router 100 % stacked columns per minute; Tokens cumulative area by provider + Codex windows;
      Procesos inline CPU sparklines.
  NEW IN 06
    - Port matrix as a real matrix (rows = the 9 ports, columns = service / local / todas).
    - RAM headroom as two bars with their minimum markers (disponible / conservador) in the inventory card.
    - Custom keyboard-reachable tooltip for event markers.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>MacacoView — 06 Cabina combinada</title>
<style>
  :root {
    /* Gentle palette from gui/pc_ai_monitor/theme.py (same variables as 01/04/05). */
    --bg: #06080f; --element: #0b0d15; --subtle: #0d0f14; --border: #313342;
    --text: #F3F6F9; --muted: #8B91A1;
    --accent: #E0C15A; --blue: #7FB4CA; --green: #B7CC85; --warning: #DEBA87;
    --error: #CB7C94; --selection: #232A40; --purple: #B99BF2; --track: #1b1e2a;
    --ui: "Cantarell", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "JetBrains Mono", "Fira Code", "DejaVu Sans Mono", "Ubuntu Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #020307; color: var(--text); font: 13px/1.4 var(--ui); }
  button { font: inherit; color: inherit; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  svg text { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  svg text.ui { font-family: var(--ui); }
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg[tabindex]:focus-visible { outline-offset: -2px; }
  svg.fluid { display: block; width: 100%; height: auto; overflow: visible; }
  .board { width: 1440px; padding: 40px 48px 64px; }
  .board > section { margin-bottom: 48px; }
  .board-label { font: 700 11px/1 var(--ui); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin: 0 0 14px; }

  /* ---------- identity ---------- */
  .identity { display: flex; align-items: center; gap: 40px; }
  .icons { display: flex; align-items: flex-end; gap: 22px; }
  .wordmark { font: 700 44px/1 var(--mono); letter-spacing: -.02em; margin: 0; }
  .wordmark b { color: var(--accent); font-weight: 700; }
  .legend { margin-left: auto; display: flex; gap: 18px; align-items: center; font: 12px var(--mono); color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 6px 16px; background: var(--element); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }

  /* ---------- status lamps: colour + shape (circle ok, diamond stale, square down) ---------- */
  .lamp { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; background: var(--green); box-shadow: 0 0 8px rgba(183,204,133,.55); }
  .lamp.off { background: transparent; border: 1.5px solid var(--muted); box-shadow: none; }
  .lamp.warn { background: var(--warning); border-radius: 1.5px; transform: rotate(45deg) scale(.9); box-shadow: 0 0 8px rgba(222,186,135,.5); }
  .lamp.crit { background: var(--error); border-radius: 2px; box-shadow: 0 0 8px rgba(203,124,148,.55); }
  .lamp.acc { background: var(--accent); box-shadow: 0 0 8px rgba(224,193,90,.5); }
  .lamp.vio { background: transparent; border: 1.5px solid var(--purple); box-shadow: none; }
  .ok { color: var(--green); } .warn-c { color: var(--warning); } .crit-c { color: var(--error); } .muted { color: var(--muted); } .acc-c { color: var(--accent); }

  /* ---------- window chrome (01) ---------- */
  .win { background: var(--bg); border: 1px solid #3a3d4e; border-radius: 12px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.55); display: flex; flex-direction: column; }
  .split { display: flex; flex: 1; min-height: 0; }
  .sidebar { width: 168px; border-right: 1px solid var(--border); background: #080a12; display: flex; flex-direction: column; flex: none; }
  .hb { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid var(--border); background: var(--bg); flex: none; }
  .hb .mid { flex: 1; display: flex; justify-content: center; align-items: center; gap: 8px; }
  .hb .title { font: 700 13px var(--ui); display: inline-flex; align-items: center; gap: 8px; }
  .hb-btn { width: 30px; height: 30px; border-radius: 6px; border: 0; background: transparent; color: var(--text); display: grid; place-items: center; cursor: pointer; }
  .hb-btn:hover { background: var(--selection); }
  .wc { display: flex; gap: 6px; }
  .wc i { width: 22px; height: 22px; border-radius: 50%; background: #1b1e2a; display: block; }
  .side-brand { display: flex; align-items: center; padding: 0 6px; }
  .nav { list-style: none; margin: 6px; padding: 0; }
  .navb { width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; font: 12px var(--ui); color: var(--text); background: none; border: 0; text-align: left; cursor: pointer; }
  .navb:hover { background: #12151f; }
  .navb svg { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .navb[aria-current="page"] { background: var(--selection); }
  .badge { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
  .badge.ok { color: var(--green); } .badge.warn { color: var(--warning); }
  .nav hr { border: 0; border-top: 1px solid var(--border); margin: 6px 4px; }
  .side-foot { margin-top: auto; padding: 10px 12px; border-top: 1px solid var(--border); }
  .content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .scroll { flex: 1; overflow: hidden; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .ic { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  .age { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #44502f; color: var(--green); border-radius: 999px; padding: 2px 10px 2px 7px; font: 600 12px var(--mono); background: var(--subtle); white-space: nowrap; }
  .age.warn { border-color: #5e4d33; color: var(--warning); } .age.crit { border-color: #5a3341; color: var(--error); }
  .age.acc { border-color: #6a5c2b; color: var(--accent); } .age.mut { border-color: var(--border); color: var(--muted); }

  /* ---------- cards & controls ---------- */
  .card { background: var(--element); border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-width: 0; }
  .cap { display: flex; align-items: center; justify-content: space-between; gap: 10px; font: 700 10.5px/1.2 var(--ui); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin: 0 0 5px; }
  .cap .num { letter-spacing: 0; text-transform: none; font-weight: 600; font-size: 11px; }
  .key { display: inline-flex; gap: 12px; letter-spacing: 0; text-transform: none; font: 600 11px var(--ui); }
  .key span { display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .btn { font: 600 13px var(--ui); color: var(--text); background: #1a1d29; border: 1px solid var(--border); border-radius: 6px; padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:hover { background: #222636; }
  .btn.suggested { background: var(--accent); border-color: var(--accent); color: #06080f; }
  .btn.suggested:hover { background: #ecd078; }
  .ico { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .ico:hover { background: #222636; color: var(--text); }
  .ico.crit { color: var(--error); border-color: #5a3341; }
  .ico[aria-disabled="true"] { opacity: .5; cursor: default; }
  kbd { font: 600 10px var(--mono); border: 1px solid #3a3d4e; border-radius: 4px; padding: 1px 5px; color: var(--muted); background: var(--subtle); }
  .suggested kbd { color: #06080f; background: rgba(6,8,15,.14); border-color: rgba(6,8,15,.45); }

  /* ---------- Motores layout: two columns shared by the three rows (left column = the 15-min axis width) ---------- */
  .row { display: grid; grid-template-columns: 1fr 276px; gap: 12px; min-height: 0; }
  .swbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: var(--element); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font: 700 15px var(--ui); }
  .swbtn:hover { background: #12151f; }
  .swglyph { display: flex; align-items: center; gap: 12px; }
  .swglyph .ic { width: 28px; height: 28px; color: var(--muted); stroke-width: 1.6; }
  .swglyph .lamp { width: 14px; height: 14px; }

  /* RAM memory blocks, proportional to GiB (04) */
  .rambar { display: flex; gap: 3px; height: 66px; }
  .rambar.s { height: 40px; }
  .blk { position: relative; border-radius: 6px; min-width: 0; padding: 6px 9px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; border: 1px solid var(--border); }
  .blk .t { display: flex; align-items: center; gap: 7px; font: 700 13px/1.2 var(--ui); white-space: nowrap; }
  .blk .m { font: 11px/1.2 var(--ui); color: var(--muted); white-space: nowrap; }
  .blk .n { font: 600 12px var(--mono); white-space: nowrap; }
  .blk .cx { height: 3px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; flex: none; }
  .blk .cx i { display: block; height: 100%; background: currentColor; opacity: .75; }
  .rambar.s .blk { padding: 4px 8px; flex-direction: row; align-items: center; gap: 6px; }
  .rambar.s .blk .t { font-size: 12px; }
  .blk.on { background: linear-gradient(180deg, #2b2510, #15130a); border: 1.5px solid var(--accent); color: var(--text); box-shadow: inset 0 0 22px rgba(224,193,90,.18); }
  .blk.on .cx { color: var(--accent); }
  .blk.otros { background: repeating-linear-gradient(135deg, #151824 0 6px, #1b1f2e 6px 12px); }
  .blk.abito { border: 1.5px dashed var(--purple); background: rgba(185,155,242,.07); color: var(--purple); }
  .blk.abito .m, .blk.abito .n { color: var(--purple); opacity: .85; }
  .blk.libre { border: 1px dashed #3a3e50; background: transparent; color: var(--muted); }
  .blk.down { border: 1.5px dashed var(--error); background: rgba(203,124,148,.06); color: var(--error); }
  .blk.new { background: linear-gradient(180deg, #251f38, #14111f); border: 1.5px solid var(--purple); color: var(--text); }
  .blk.new .cx { color: var(--purple); }
  .blk.empty { border: 1.5px dashed #3a3e50; background: transparent; }

  /* instruments (04) */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; justify-items: center; }
  .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; justify-items: center; align-items: start; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
  .tile .tl { font: 700 10.5px var(--ui); letter-spacing: .06em; color: var(--muted); text-transform: uppercase; text-align: center; }
  .tile svg { display: block; }
  .reqs { display: flex; align-items: center; gap: 6px; height: 64px; }
  .reqs .pill { width: 18px; height: 10px; border-radius: 6px; border: 1.5px solid var(--muted); }
  .reqs .pill.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px rgba(224,193,90,.5); }
  .reqs b { font: 700 16px var(--mono); margin-left: 2px; }
  .sweep { animation: sweep 1.6s linear infinite; }
  .skelr { fill: #1c2030; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes sweep { from { stroke-dashoffset: 14; } to { stroke-dashoffset: -100; } }
  @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  .pulse { animation: pulse 1.3s ease-in-out infinite; }

  /* time-lane events (05) */
  .ev { cursor: pointer; }
  .ev .ring { opacity: 0; }
  .ev:hover .ring, .ev:focus-visible .ring { opacity: 1; }
  .ev:focus-visible { outline: none; }

  /* inventory (01) + RAM headroom */
  .inv-row { display: grid; grid-template-columns: 14px 104px 1fr 88px 36px; gap: 12px; align-items: center; padding: 4px 0; border-top: 1px solid #1f2230; font: 600 12px var(--mono); }
  .inv-row:first-of-type { border-top: 0; }
  .inv-row .nm { font: 700 13px var(--ui); }
  .inv-row .cxt { display: block; }
  .bar2 { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .bar2 i { display: block; height: 100%; border-radius: 3px; }
  .hr { border: 0; border-top: 1px solid var(--border); margin: 8px 0; }
  .headroom { display: grid; grid-template-columns: 82px 1fr 138px; gap: 4px 12px; align-items: center; font: 600 12px var(--mono); }
  .headroom .lb { font: 12px var(--ui); color: var(--muted); }
  .headroom svg { display: block; width: 100%; height: 14px; overflow: visible; }

  /* update card (01 fields + 04 rail) */
  .upd { display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
  .fields { display: flex; flex-direction: column; }
  .fr { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; border-top: 1px solid #1f2230; font: 600 12px var(--mono); }
  .fr .lb { font: 12px var(--ui); color: var(--muted); }
  .fr .ic { width: 13px; height: 13px; color: var(--green); stroke-width: 2; }

  /* ---------- states ---------- */
  .states { display: grid; grid-template-columns: repeat(3, 432px); gap: 24px; }
  .st-card { background: var(--element); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; min-height: 250px; }
  .st-h { display: flex; align-items: center; gap: 10px; }
  .st-h h3 { margin: 0; font: 700 11px/1 var(--ui); letter-spacing: .1em; color: var(--accent); text-transform: uppercase; flex: 1; }
  .st-cap { margin: 0; font: 12px/1.35 var(--ui); color: var(--muted); }
  .st-body { display: flex; flex-direction: column; gap: 10px; flex: 1; justify-content: center; }
  .g2 { display: grid; gap: 10px; align-items: center; }
  .lanebox { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--element); }
  .stepper { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; }
  .stepper li { position: relative; flex: 1; display: flex; justify-content: center; }
  .stepper li + li::before { content: ""; position: absolute; right: 50%; left: -50%; top: 50%; height: 2px; background: #2a2e3f; }
  .stepper li.done + li::before, .stepper li.now::before { background: var(--green); }
  .stepper .dot { position: relative; z-index: 1; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: 2px solid #3a3e50; color: var(--muted); }
  .stepper li.done .dot { background: var(--green); border-color: var(--green); color: #06080f; }
  .stepper li.now .dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 12px rgba(224,193,90,.45); }
  .stepper li.now .dot svg { animation: spin 2.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ctxeq { display: grid; grid-template-columns: 1fr auto; gap: 8px 8px; align-items: center; }
  .dialog { background: #11131d; border: 1px solid #3a3d4e; border-radius: 12px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .dlg-h { margin: 0; font: 700 15px var(--ui); display: flex; align-items: center; gap: 10px; justify-content: center; }
  .dlg-h .g { color: var(--accent); } .dlg-h .a { color: var(--purple); }
  .ctxrow { display: grid; grid-template-columns: auto 1fr 18px 1fr auto; gap: 8px; align-items: center; font: 600 12px var(--mono); }
  .dlg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dlg-row .btn.destructive { color: var(--error); border-color: #5a3341; background: #160d12; }

  /* ---------- other pages ---------- */
  .pages { display: grid; grid-template-columns: repeat(2, 664px); gap: 24px 16px; }
  .mini { width: 664px; height: 430px; }
  .mini .scroll { padding: 10px; }
  .fill { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  .tm { display: flex; gap: 3px; flex: 1; min-height: 0; }
  .tm > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; min-height: 0; }
  .cell { border-radius: 5px; padding: 5px 9px; border: 1px solid; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; min-height: 0; overflow: hidden; font: 700 12px var(--ui); }
  .cell b { font: 600 12px var(--mono); }
  .cell.inl { flex-direction: row; align-items: center; }
  .cell.big { font-size: 22px; padding: 12px 14px; }
  .cell.big b { font-size: 30px; }
  .sparkbox { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
  .sparkbox b { font: 700 18px var(--mono); }
  .sparkbox small { font: 400 11px var(--ui); color: var(--muted); margin-left: 4px; }
  table.ptab { width: 100%; border-collapse: collapse; }
  table.ptab th { text-align: left; padding: 0 0 6px; font: 700 10.5px var(--ui); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  table.ptab th button { background: none; border: 0; padding: 2px 4px; margin-left: -4px; border-radius: 4px; cursor: pointer; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; display: inline-flex; gap: 5px; align-items: center; }
  table.ptab th button:hover { color: var(--text); }
  table.ptab th[aria-sort] button { color: var(--accent); }
  table.ptab td { padding: 11px 0; border-top: 1px solid #1f2230; vertical-align: middle; }
  table.ptab td:last-child { padding-left: 16px; }
  table.ptab td.nm { font: 600 13px var(--mono); width: 130px; }
  .ramcell { position: relative; height: 24px; border-radius: 4px; background: #12141c; width: 330px; }
  .ramcell i { display: block; height: 100%; border-radius: 4px; min-width: 4px; }
  .ramcell b { position: absolute; right: 8px; top: 3px; font: 700 13px var(--mono); }
  .ramcell b.in { color: #06080f; } .ramcell b.out { color: var(--text); }
  .pmx { display: grid; grid-template-columns: 90px 190px 1fr 1fr; flex: 1; align-content: stretch; }
  .pmx > * { display: flex; align-items: center; border-top: 1px solid #1f2230; padding: 0 8px; min-height: 0; }
  .pmx .h { border-top: 0; font: 700 10.5px var(--ui); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  .pmx .h.c, .pmx .c { justify-content: center; }
  .pmx .pn { font: 700 15px var(--mono); }
  .pmx .sv { font: 12.5px var(--ui); color: var(--muted); }
  .pmx .ex { background: rgba(222,186,135,.1); }
  .pmx .ex.pn { color: var(--warning); }
  .pmx svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  #tip { position: absolute; z-index: 10; max-width: 340px; background: #11131d; border: 1px solid #5a5d70; border-radius: 6px; padding: 5px 9px; font: 12px/1.35 var(--ui); color: var(--text); pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.6); }
  #tip[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .pulse, .skelr { opacity: .8; }
  }
</style>
</head>
<body>
<main class="board" aria-label="MacacoView, dirección 06: cabina combinada">

<!-- ================= A. Identity ================= -->
<section aria-label="Identidad">
  <div class="identity">
    <div class="icons" role="group" aria-label="Ícono de la app en 128, 48 y 16 px">
      <svg width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Ícono MacacoView 128 px"><use href="#icon"/></svg>
      <svg width="48" height="48" viewBox="0 0 128 128" role="img" aria-label="Ícono 48 px"><use href="#icon"/></svg>
      <svg width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="Ícono simbólico 16 px"><use href="#icon-symbolic"/></svg>
    </div>

    const g = S('g', { role: 'img', 'aria-label': 'Reparto por minuto de las rutas en los últimos 15 minutos; ahora 87 % local, 9 % cloud, 4 % cola' });
    g.append(S('text', { x: 0, y: 10, 'font-size': 10.5, 'font-weight': 700, fill: C.muted, class: 'ui', 'letter-spacing': '.08em' }, 'RUTAS POR MINUTO · 100 %'));
    const a = noise(n, 61, 1), b = noise(n, 62, 1);

        const h = p / 100 * CH; yy -= h;
        g.append(S('rect', { x: i * colW + 2, y: yy, width: colW - 4, height: Math.max(0, h - 1), rx: 2, fill: cols[k], opacity: i === n - 1 ? 1 : .8 }, [ttl(nm[k] + ' ' + p.toFixed(0) + ' %')]));

    g.append(S('text', { x: 0, y: Y0 + CH + 22, 'font-size': 11, fill: C.muted, class: 'ui' }, '−15 min'));
    g.append(S('text', { x: CW, y: Y0 + CH + 22, 'text-anchor': 'end', 'font-size': 11, 'font-weight': 700, fill: C.acc, class: 'ui' }, 'ahora'));
    svg.append(g);
    const rg = S('g', { role: 'img', 'aria-label': 'Reparto actual: 87 % local, 9 % cloud, 4 % cola' });
    rg.append(S('text', { x: 470, y: 10, 'font-size': 10.5, 'font-weight': 700, fill: C.muted, class: 'ui', 'letter-spacing': '.08em' }, 'AHORA'));
    nm.forEach(function (name, k) {
      const yy = 66 + k * 66;
      rg.append(S('rect', { x: 470, y: yy - 12, width: 10, height: 10, rx: 2.5, fill: cols[k] }), S('text', { x: 488, y: yy - 2, 'font-size': 12.5, fill: C.muted, class: 'ui' }, name), S('text', { x: 634, y: yy + 26, 'text-anchor': 'end', 'font-size': 32, 'font-weight': 700, fill: C.text }, now[k] + '%'));
    });
    svg.append(rg);
    const ss = S('g', { role: 'img', 'aria-label': '3 sesiones activas' }, [ttl('3 sesiones activas')]);
    ss.append(S('text', { x: 470, y: 268, 'font-size': 10.5, 'font-weight': 700, fill: C.muted, class: 'ui', 'letter-spacing': '.08em' }, 'SESIONES'));
    [0, 1, 2].forEach(function (i) {
      ss.append(S('circle', { cx: 486 + i * 48, cy: 304, r: 16, fill: 'rgba(183,204,133,.12)', stroke: C.green, 'stroke-width': 2 }), S('circle', { cx: 486 + i * 48, cy: 304, r: 6, fill: C.green }));
    });
    svg.append(ss);
    sc.append(card([svg], 'padding:8px 10px;justify-content:center'));
  })();

  // Tokens — cumulative area by provider today (05) + Codex windows
  (function () {
    const sc = miniWin('Tokens', 'Página Tokens: tokens acumulados hoy por proveedor y ventanas de Codex');
    const svg = S('svg', { class: 'fluid', width: 642, height: 346, viewBox: '0 0 642 346', role: 'group', 'aria-label': 'Tokens' });
    const names = ['local', 'openai-codex', 'anthropic'], tot = [11.4, 4.4, 2.6], cols = [C.acc, C.sky, C.viol], n = 37;
    const ser = tot.map(function (T2, k) {
      const r = rng(90 + k); let c = 0; const inc = [0];
      for (let i = 1; i < n; i++) { const act = Math.pow(Math.sin(i / n * Math.PI), 1.2); inc.push(Math.pow(r(), 1.7) * (.25 + act)); }
      const out = inc.map(function (v) { c += v; return c; });
      return out.map(function (v) { return v / out[n - 1] * T2; });
    });
    const CW = 430, Y0 = 24, CH = 212, Y = function (v) { return Y0 + CH - v / 20 * CH; }, X = function (i) { return i * CW / (n - 1); };
    const g = S('g', { role: 'img', 'aria-label': 'Tokens acumulados hoy por proveedor: local 11.4 M, openai-codex 4.4 M, anthropic 2.6 M; total 18.4 M' });
    g.append(S('text', { x: 0, y: 10, 'font-size': 10.5, 'font-weight': 700, fill: C.muted, class: 'ui', 'letter-spacing': '.08em' }, 'TOKENS HOY · ACUMULADO'));
    for (let q = 1; q <= 4; q++) g.append(S('line', { x1: 0, y1: Y(q * 5), x2: CW, y2: Y(q * 5), stroke: '#171a27' }));
    let prev = new Array(n).fill(0);
    ser.forEach(function (s, k) {
      const top = prev.map(function (p, i) { return p + s[i]; });
      const up = top.map(function (v, i) { return [X(i), Y(v)]; }), lo = prev.map(function (v, i) { return [X(i), Y(v)]; }).reverse();
      g.append(S('path', { d: 'M' + pts(up) + 'L' + pts(lo) + 'Z', fill: cols[k], 'fill-opacity': .85, stroke: C.bg, 'stroke-width': .8 }, [ttl(names[k] + ' ' + tot[k] + ' M')]));
      prev = top;
    });
    svg.append(g);
    const lg = S('g', { role: 'img', 'aria-label': 'Leyenda: local 11.4 M, openai-codex 4.4 M, anthropic 2.6 M; total 18.4 M' });
    lg.append(S('text', { x: 634, y: 40, 'text-anchor': 'end', 'font-size': 32, 'font-weight': 700, fill: C.text }, '18.4M'));
    lg.append(S('text', { x: 634, y: 58, 'text-anchor': 'end', 'font-size': 11, fill: C.muted, class: 'ui' }, 'tokens hoy'));
    names.forEach(function (nm, k) {
      const yy = 108 + k * 46;
      lg.append(S('rect', { x: 466, y: yy - 11, width: 10, height: 10, rx: 2.5, fill: cols[k] }), S('text', { x: 484, y: yy - 1, 'font-size': 12.5, fill: C.muted, class: 'ui' }, nm), S('text', { x: 634, y: yy + 20, 'text-anchor': 'end', 'font-size': 20, 'font-weight': 700, fill: C.text }, tot[k] + 'M'));
    });
    svg.append(lg);
    svg.append(S('text', { x: 0, y: 274, 'font-size': 10.5, 'font-weight': 700, fill: C.muted, class: 'ui', 'letter-spacing': '.08em' }, 'CODEX · VENTANAS'));
    [['5 h', 38, C.green, 284], ['semana', 61, C.warn, 316]].forEach(function (b) {
      const bg = S('g', { role: 'img', 'aria-label': 'Ventana Codex ' + b[0] + ': ' + b[1] + ' % usado' });
      bg.append(S('text', { x: 0, y: b[3] + 10, 'font-size': 12.5, fill: C.muted, class: 'ui' }, b[0]));
      bg.append(S('rect', { x: 66, y: b[3], width: 500, height: 10, rx: 5, fill: C.track }));
      bg.append(S('rect', { x: 66, y: b[3], width: 500 * b[1] / 100, height: 10, rx: 5, fill: b[2] }, [ttl(b[1] + ' %')]));
      bg.append(S('text', { x: 634, y: b[3] + 11, 'text-anchor': 'end', 'font-size': 15, 'font-weight': 700, fill: C.text }, b[1] + ' %'));
      svg.append(bg);
    });
    sc.append(card([svg], 'padding:8px 10px;justify-content:center'));
  })();

  // Puertos — port matrix of the 9 real ports (04 colouring: exposed amber + globe)
  (function () {
    const sc = miniWin('Puertos', 'Página Puertos: 9 puertos escuchando, 2 expuestos en todas las interfaces (22 y 5353)');
    const ports = [[22, 'ssh', 1], [5353, 'mdns', 1], [631, 'ipp', 0], [7420, 'hermes', 0], [7600, 'open-pencil', 0], [9222, 'chrome devtools', 0], [11009, 'router', 0], [11012, 'embed-small', 0], [11070, 'gufo', 0]];
    const tt = { 22: 'TCP · ssh · sshd', 5353: 'UDP · mdns · avahi-daemon', 631: 'TCP · ipp · cupsd', 7420: 'TCP · hermes', 7600: 'TCP · open-pencil', 9222: 'TCP · chrome devtools', 11009: 'TCP · router · abito-router', 11012: 'TCP · embed-small · llama-server', 11070: 'TCP · gufo · llama-server' };
    const m = H('div', { class: 'pmx', role: 'table', 'aria-label': '9 puertos: 7 solo local, 2 en todas las interfaces (22 y 5353)' });
    const hr = H('div', { role: 'row', style: 'display:contents' }, [H('div', { class: 'h', role: 'columnheader' }, 'Puerto'), H('div', { class: 'h', role: 'columnheader' }, 'Servicio'), H('div', { class: 'h c', role: 'columnheader' }, 'Local'), H('div', { class: 'h c', role: 'columnheader' }, 'Todas')]);
    m.append(hr);
    const mark = function (name, color) { const s = S('svg', { 'aria-hidden': 'true' }); s.style.color = color; s.append(S('use', { href: '#' + name })); return s; };
    ports.forEach(function (p) {
      const ex = p[2] === 1, cls = ex ? ' ex' : '';
      const row = H('div', { role: 'row', style: 'display:contents', title: p[0] + ' · ' + tt[p[0]] + ' · ' + (ex ? 'todas las interfaces' : 'solo local') });
      const c3 = H('div', { class: 'c' + cls, role: 'cell', 'aria-label': ex ? 'no' : 'sí' }), c4 = H('div', { class: 'c' + cls, role: 'cell', 'aria-label': ex ? 'sí, expuesto' : 'no' });
      if (!ex) c3.append(mark('i-lock', C.blue)); else c4.append(mark('i-globe', C.warn));
      row.append(H('div', { class: 'pn' + cls, role: 'cell' }, String(p[0])), H('div', { class: 'sv' + cls, role: 'cell' }, p[1]), c3, c4);
      m.append(row);
    });
    sc.append(card([m], 'padding:10px 14px'));
  })();

  // Procesos — 01's sortable table reduced to name + inline RAM bar (+ 05 CPU sparkline)
  (function () {
    const sc = miniWin('Procesos', 'Página Procesos: top 5 por RAM, llama-server 49.2 GiB');
    const rows = [['llama-server', 49.2, 312, 3.1, 'PID 48211 · llama-server -m qwen3.8-flash-next-Q4_K_XL.gguf --port 11070 -c 131072'], ['firefox', 2.8, 6, 1.2, 'PID 3120 · firefox'], ['node', 1.9, 3, .8, 'PID 41877 · node pi --session 7f2c'], ['hermes', 1.6, 1, .4, 'PID 2214 · hermes serve --port 7420'], ['gnome-shell', 1.1, 4, 1.4, 'PID 1873 · gnome-shell']];
    rows.forEach(function (r, i) {
      const nz = noise(24, 120 + i, 2); r.push(nz.map(function (q, j) { return j === 23 ? r[2] : Math.max(0, r[2] * (1 - r[3] * .1) + (q - .5) * r[2] * r[3] * .5); }));
    });
    let key = 'ram', dir = -1;
    const tab = H('table', { class: 'ptab' }), thead = H('thead'), tr = H('tr'), tbody = H('tbody');
    const heads = [['name', 'Proceso'], ['ram', 'RAM GiB'], ['cpu', 'CPU · 5 min']];
    const ths = {};
    heads.forEach(function (h) {
      const th = H('th', { scope: 'col' }), b = H('button', { 'aria-label': 'Ordenar por ' + h[1] }, [document.createTextNode(h[1]), ico('i-sort', 11)]);
      b.addEventListener('click', function () { if (key === h[0]) dir = -dir; else { key = h[0]; dir = h[0] === 'name' ? 1 : -1; } render(); });
      th.append(b); ths[h[0]] = th; tr.append(th);
    });
    thead.append(tr); tab.append(thead, tbody);
    function spark(v) {
      const w = 150, h = 26, mn = Math.min.apply(null, v), mx = Math.max.apply(null, v), sp = (mx - mn) || 1;
      const p = v.map(function (q, j) { return [2 + j * (w - 6) / 23, h - 3 - (q - mn) / sp * (h - 8)]; });
      const s = S('svg', { width: w, height: h, viewBox: '0 0 ' + w + ' ' + h, 'aria-hidden': 'true' });
      s.append(S('path', { d: 'M' + pts(p) + 'L' + (w - 4) + ' ' + h + 'L2 ' + h + 'Z', fill: C.blue, 'fill-opacity': .18 }), S('path', { d: 'M' + pts(p), fill: 'none', stroke: C.blue, 'stroke-width': 1.6, 'stroke-linejoin': 'round' }), S('circle', { cx: p[23][0], cy: p[23][1], r: 3.2, fill: C.blue, stroke: C.bg, 'stroke-width': 2 }));
      return s;
    }
    function render() {
      const idx = { name: 0, ram: 1, cpu: 2 }[key];
      const sorted = rows.slice().sort(function (a, b) { return (a[idx] > b[idx] ? 1 : a[idx] < b[idx] ? -1 : 0) * dir; });
      heads.forEach(function (h) { if (h[0] === key) ths[h[0]].setAttribute('aria-sort', dir > 0 ? 'ascending' : 'descending'); else ths[h[0]].removeAttribute('aria-sort'); });
      tbody.replaceChildren.apply(tbody, sorted.map(function (r) {
        const t = H('tr', { title: r[4] });
        const bw = 330 * r[1] / 49.2, first = r[1] > 40;
        const rc = H('div', { class: 'ramcell', role: 'img', 'aria-label': r[0] + ': ' + r[1] + ' GiB de RAM' }), f = H('i'); f.style.width = Math.max(4, bw) + 'px'; f.style.background = first ? 'var(--accent)' : 'var(--blue)';
        rc.append(f);
        if (first) rc.append(H('b', { class: 'in num' }, r[1] + ' GiB')); else { const bb = H('b', { class: 'out num' }, r[1] + ' GiB'); bb.style.left = (bw + 8) + 'px'; bb.style.right = 'auto'; rc.append(bb); }
        const sp = H('div', { role: 'img', 'aria-label': 'CPU de ' + r[0] + ': ' + r[2] + ' % ahora' }); sp.append(spark(r[5]));
        t.append(H('td', { class: 'nm' }, r[0]), H('td', null, [rc]), H('td', null, [sp]));
        return t;
      }));
    }
    render();
    sc.append(card([tab], 'padding:12px 16px'));
  })();
})();
