<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>MacacoView — 05 Cabina visual · línea de tiempo</title>
<style>
  :root {
    /* Gentle palette from gui/pc_ai_monitor/theme.py (same variables as 01). */
    --bg: #06080f; --element: #0b0d15; --subtle: #0d0f14; --border: #313342;
    --text: #F3F6F9; --muted: #8B91A1; --muted-dim: #5C6170;
    --accent: #E0C15A; --blue: #7FB4CA; --green: #B7CC85; --warning: #DEBA87;
    --error: #CB7C94; --selection: #232A40;
    --ui: "Cantarell", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "JetBrains Mono", "Fira Code", "DejaVu Sans Mono", "Ubuntu Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #020307; color: var(--text); font: 13px/1.4 var(--ui); }
  .num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg text { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  svg text.ui { font-family: var(--ui); }
  .board { width: 1440px; padding: 40px 48px 64px; }
  .board > section { margin-bottom: 48px; }
  .board-label { font: 700 11px/1 var(--ui); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin: 0 0 14px; }

  /* ---------- identity ---------- */
  .identity { display: flex; align-items: center; gap: 40px; }
  .icons { display: flex; align-items: flex-end; gap: 22px; }
  .wordmark { font: 700 44px/1 var(--mono); letter-spacing: -.02em; }
  .wordmark b { color: var(--accent); font-weight: 700; }

  /* ---------- window chrome (as 01) ---------- */
  .win { background: var(--bg); border: 1px solid #3a3d4e; border-radius: 12px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.55); display: flex; flex-direction: column; }
  .split { display: flex; flex: 1; min-height: 0; }
  .sidebar { width: 168px; border-right: 1px solid var(--border); background: #080a12; display: flex; flex-direction: column; flex: none; }
  .hb { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid var(--border); background: var(--bg); flex: none; }
  .hb .title { flex: 1; text-align: center; font-size: 13px; font-weight: 700; }
  .hb-btn { width: 30px; height: 30px; border-radius: 6px; border: 0; background: transparent; color: var(--text); display: grid; place-items: center; cursor: pointer; }
  .hb-btn:hover { background: var(--selection); }
  .wc { display: flex; gap: 6px; }
  .wc i { width: 22px; height: 22px; border-radius: 50%; background: #1b1e2a; display: block; }
  .side-brand { display: flex; align-items: center; gap: 8px; padding: 0 2px; font: 700 13px var(--mono); }
  .side-brand b { color: var(--accent); }
  .nav { list-style: none; margin: 6px; padding: 0; }
  .nav li { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; font-size: 12px; }
  .nav li svg { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .nav li[aria-current="page"] { background: var(--selection); }
  .side-foot { margin-top: auto; padding: 8px 10px; border-top: 1px solid var(--border); }
  .content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .scroll { flex: 1; overflow: hidden; padding: 14px; }
  .ic { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  .pill { display: inline-flex; align-items: center; gap: 5px; font: 600 11px var(--mono); border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px 2px 7px; color: var(--green); background: var(--subtle); white-space: nowrap; }
  .pill.warn { color: var(--warning); border-color: #5e4d33; }
  .pill.crit { color: var(--error); border-color: #5a3341; }
  .pill.acc { color: var(--accent); border-color: #6a5c2b; }
  .pill.mut { color: var(--muted); }
  .btn { font: 600 12px var(--ui); color: var(--text); background: #1a1d29; border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .btn:hover { background: #222636; }
  .btn.suggested { background: var(--accent); border-color: var(--accent); color: #06080f; }
  .btn.destructive { color: var(--error); border-color: #5a3341; background: #160d12; }
  kbd { font: 600 10.5px var(--mono); color: var(--muted); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--subtle); }

  /* ---------- Motores: lane wall + rail ---------- */
  .motores { display: grid; grid-template-columns: 768px 1fr; gap: 12px; align-items: start; }
  .wall { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--element); }
  .wall svg { display: block; }
  .rail { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--element); }
  .rr { display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #1f2230; gap: 8px; }
  .rr:nth-child(even) { background: #090b13; }
  .rr .big { font: 700 30px/1 var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  .rr .big small { display: block; font: 400 11px/1.5 var(--mono); color: var(--muted); }
  .rr.act { flex-direction: column; align-items: stretch; justify-content: center; gap: 8px; }
  .rr.act .btn { justify-content: flex-start; padding: 7px 10px; }
  .rr.act .btn kbd { margin-left: auto; }
  .rr.act .btn.upd { border-color: #6a5c2b; color: var(--accent); }
  .rr.act .btn .t { font: 600 12px var(--mono); }
  .lamp { display: inline-flex; align-items: center; gap: 6px; color: var(--green); }
  .lamp i { width: 9px; height: 9px; border-radius: 50%; background: var(--green); display: block; box-shadow: 0 0 0 3px rgba(183,204,133,.18); }
  .mtp { text-align: center; }
  .mtp small { display: block; font: 700 10px var(--ui); letter-spacing: .08em; color: var(--muted); margin-top: 1px; }

  .ev { cursor: pointer; }
  .ev .ring { opacity: 0; }
  .ev:hover .ring, .ev:focus-visible .ring { opacity: 1; }
  .ev:focus-visible { outline: none; }
  svg:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .pulse { animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }

  /* ---------- states ---------- */
  .states { display: grid; grid-template-columns: repeat(3, 432px); gap: 24px; }
  .st-card { background: var(--bg); border: 1px solid #3a3d4e; border-radius: 12px; padding: 12px 16px 16px; box-shadow: 0 12px 34px rgba(0,0,0,.45); }
  .st-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .st-h h3 { margin: 0; font: 700 11px/1 var(--ui); letter-spacing: .1em; color: var(--accent); text-transform: uppercase; flex: 1; }
  .st-card .wall { border-radius: 6px; }
  .st-card .stepper { display: block; margin: -2px 0 8px; }
  .st-card.dialog { background: #11131d; }
  .dlg-h { display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 15px var(--ui); margin: 0 0 12px; }
  .dlg-h .ic { width: 18px; height: 18px; color: var(--muted); }
  .dlg-h .g { color: var(--accent); } .dlg-h .a { color: #B99BF2; }
  .dlg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .dlg-row .btn { justify-content: center; padding: 9px; }

  /* ---------- other pages ---------- */
  .pages { display: grid; grid-template-columns: repeat(2, 664px); gap: 24px 16px; }
  .mini { height: 430px; width: 664px; }
  .mini .scroll { padding: 10px; }
  .mini .scroll svg { display: block; }

  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: .8; } }
</style>
</head>
<body>
<main class="board" aria-label="Dirección 05: Cabina visual, línea de tiempo">

<!-- ================= A. Identity ================= -->
<section aria-labelledby="id-h">
  <h2 class="board-label" id="id-h">05 · Línea de tiempo</h2>
  <div class="identity">
    <div class="icons" role="group" aria-label="Ícono de la app en 128, 48 y 16 px">
      <svg width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Ícono MacacoView 128 px"><use href="#icon"/></svg>
      <svg width="48" height="48" viewBox="0 0 128 128" role="img" aria-label="Ícono 48 px"><use href="#icon"/></svg>
      <svg width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="Ícono simbólico 16 px"><use href="#icon-symbolic"/></svg>
    </div>
    <div class="wordmark">macaco<b>view</b></div>
  </div>
</section>

<!-- ================= B. Motores at real size ================= -->
<section aria-labelledby="mot-h">
  <h2 class="board-label" id="mot-h">Motores</h2>
  <div class="win" style="width:1180px;height:800px">
    <div class="split">
      <nav class="sidebar" aria-label="Secciones">
        <div class="hb"><div class="side-brand"><svg width="24" height="24" viewBox="0 0 128 128" role="img" aria-label="MacacoView"><use href="#icon"/></svg></div></div>
        <ul class="nav">
          <li aria-current="page"><svg viewBox="0 0 16 16"><rect x="2" y="4" width="12" height="8" rx="1.5"/><path d="M5 8h2M9 8h2"/></svg>Motores</li>
          <li><svg viewBox="0 0 16 16"><path d="M2 13V9M6 13V5M10 13V7M14 13V3"/></svg>Recursos</li>
          <li><svg viewBox="0 0 16 16"><path d="M2 8h4l2-4 2 8 2-4h2"/></svg>Router</li>
          <li><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5V8l4 2"/></svg>Tokens</li>
          <li><svg viewBox="0 0 16 16"><path d="M3 5h10M3 8h10M3 11h10"/><circle cx="5" cy="5" r=".8"/></svg>Puertos</li>
          <li><svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/><path d="M5 6h6M5 9h4"/></svg>Procesos</li>
        </ul>
        <div class="side-foot">
          <button class="hb-btn" aria-label="Configuración" title="Configuración"><svg class="ic" viewBox="0 0 16 16" style="width:16px;height:16px"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
        </div>
      </nav>
      <div class="content">
        <header class="hb">
          <button class="hb-btn" aria-label="Ocultar barra lateral"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></svg></button>
          <div class="title" role="heading" aria-level="1" aria-label="Motores · Gufo activo" title="Motores · Gufo activo"><span class="lamp"><i></i></span></div>
          <span class="pill" title="Edad de la medición: 4 s" role="img" aria-label="Edad de la medición: 4 segundos"><svg class="ic"><use href="#i-clock"/></svg>4 s</span>
          <button class="hb-btn" aria-label="Menú principal"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
          <div class="wc" aria-hidden="true"><i></i><i></i><i></i></div>
        </header>
        <div class="scroll motores">
          <div class="wall" id="wall-main"></div>
          <aside class="rail" aria-label="Valores actuales y acciones">
            <div class="rr act" style="height:124px">
              <span class="lamp" role="img" aria-label="GPU sana: 0 pérdidas de dispositivo" title="GPU sana · 0 pérdidas de dispositivo"><i></i><svg class="ic" style="width:18px;height:18px"><use href="#i-gpu"/></svg></span>
              <button class="btn" aria-label="Cambiar a Abito (tecla S). Corta los pedidos en curso y deja ≈ 85 s sin motor local" title="Cambiar a Abito · ≈ 85 s sin motor local, corta los pedidos en curso"><svg class="ic"><use href="#i-swap"/></svg><span class="t">abito</span><kbd>S</kbd></button>
              <button class="btn upd" aria-label="Actualizar Gufo de b6532 a b6587 (tecla U)" title="Actualizar gufo · b6532 → b6587 · revisión a3f91c2"><svg class="ic"><use href="#i-up"/></svg><span class="t">b6532→b6587</span><kbd>U</kbd></button>
            </div>
            <div class="rr" style="height:132px">
              <div class="mtp" role="img" aria-label="Aceptación MTP 0.71" title="Aceptación MTP 0.71 (contadores gufo_spec_*)"><svg id="mtp-ring" width="56" height="56" viewBox="0 0 56 56"></svg><small>MTP</small></div>
              <div class="big" style="color:#E0C15A">47.8<small>tok/s</small></div>
            </div>
            <div class="rr" style="height:116px;justify-content:flex-end"><div class="big" style="color:#7FB4CA">1 046</div></div>
            <div class="rr" style="height:116px;justify-content:flex-end"><div class="big" style="color:#A3B5D6">31 %</div></div>
            <div class="rr" style="height:132px;justify-content:flex-end"><div class="big" style="color:#B7CC85">51.1<small>GiB</small></div></div>
            <div class="rr" style="height:56px;justify-content:flex-end"><div class="big" style="color:#8FB8DD">1</div></div>
            <div class="rr" style="height:32px;border-bottom:0"></div>
          </aside>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ================= C. States ================= -->
<section aria-labelledby="st-h">
  <h2 class="board-label" id="st-h">Estados</h2>
  <div class="states">
    <article class="st-card" aria-label="Estado cargando">
      <div class="st-h"><h3>cargando</h3><span class="pill mut" title="Sin medición todavía"><svg class="ic"><use href="#i-clock"/></svg>—</span></div>
      <div class="wall" data-scene="loading"></div>
    </article>
    <article class="st-card" aria-label="Estado medición vieja">
      <div class="st-h"><h3>viejo</h3><span class="pill warn" title="Última medición hace 73 s"><svg class="ic"><use href="#i-clock"/></svg>73 s</span></div>
      <div class="wall" data-scene="stale"></div>
    </article>
    <article class="st-card" aria-label="Estado motor caído">
      <div class="st-h"><h3>caído</h3><span class="pill crit" title="El motor cayó hace 100 s"><svg class="ic"><use href="#i-clock"/></svg>100 s</span></div>
      <div class="wall" data-scene="down"></div>
    </article>
    <article class="st-card" aria-label="Estado actualización en curso">
      <div class="st-h"><h3>actualizando</h3><span class="pill acc" title="Reinicio en curso: 52 s de ≈ 85 s"><svg class="ic"><use href="#i-clock"/></svg>52 s</span></div>
      <svg class="stepper" id="stepper-upd" width="200" height="34" viewBox="0 0 200 34"></svg>
      <div class="wall" data-scene="updating"></div>
    </article>
    <article class="st-card" aria-label="Estado revertido">
      <div class="st-h"><h3>revertido</h3><span class="pill warn" title="Revertido a b6532 hace 4 s"><svg class="ic"><use href="#i-clock"/></svg>4 s</span></div>
      <svg class="stepper" id="stepper-rb" width="200" height="34" viewBox="0 0 200 34"></svg>
      <div class="wall" data-scene="rolledback"></div>
    </article>
    <article class="st-card dialog" role="group" aria-label="Vista previa de la confirmación del cambio de motor">
      <div class="dlg-h"><span class="g">gufo</span><svg class="ic"><use href="#i-swap"/></svg><span class="a">abito</span></div>
      <div class="wall" data-scene="confirm"></div>
      <div class="dlg-row"><button class="btn">Cancelar</button><button class="btn destructive">Cambiar</button></div>
    </article>
  </div>
</section>

<!-- ================= D. Other five pages ================= -->
<section aria-labelledby="pg-h">
  <h2 class="board-label" id="pg-h">Páginas</h2>
  <div class="pages">
    <div class="win mini"><div class="content"><header class="hb"><button class="hb-btn" aria-label="Mostrar barra lateral"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></svg></button><div class="title">Recursos</div><div class="wc" aria-hidden="true"><i></i><i></i><i></i></div></header><div class="scroll"><svg id="pg-recursos" width="642" height="362" viewBox="0 0 642 362" role="group" aria-label="Recursos"></svg></div></div></div>
    <div class="win mini"><div class="content"><header class="hb"><button class="hb-btn" aria-label="Mostrar barra lateral"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></svg></button><div class="title">Router</div><div class="wc" aria-hidden="true"><i></i><i></i><i></i></div></header><div class="scroll"><svg id="pg-router" width="642" height="362" viewBox="0 0 642 362" role="group" aria-label="Router"></svg></div></div></div>
    <div class="win mini"><div class="content"><header class="hb"><button class="hb-btn" aria-label="Mostrar barra lateral"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></svg></button><div class="title">Tokens</div><div class="wc" aria-hidden="true"><i></i><i></i><i></i></div></header><div class="scroll"><svg id="pg-tokens" width="642" height="362" viewBox="0 0 642 362" role="group" aria-label="Tokens"></svg></div></div></div>
    <div class="win mini"><div class="content"><header class="hb"><button class="hb-btn" aria-label="Mostrar barra lateral"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></svg></button><div class="title">Puertos</div><div class="wc" aria-hidden="true"><i></i><i></i><i></i></div></header><div class="scroll"><svg id="pg-puertos" width="642" height="362" viewBox="0 0 642 362" role="group" aria-label="Puertos"></svg></div></div></div>
    <div class="win mini"><div class="content"><header class="hb"><button class="hb-btn" aria-label="Mostrar barra lateral"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></svg></button><div class="title">Procesos</div><div class="wc" aria-hidden="true"><i></i><i></i><i></i></div></header><div class="scroll"><svg id="pg-procesos" width="642" height="362" viewBox="0 0 642 362" role="group" aria-label="Procesos"></svg></div></div></div>
  </div>
</section>

</main>

<!-- shared symbols -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1e2e"/><stop offset="1" stop-color="#06080f"/></linearGradient>
    <symbol id="icon" viewBox="0 0 128 128">
      <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#ig)" stroke="#313342" stroke-width="2"/>
      <circle cx="28" cy="58" r="13" fill="#7a5a40"/><circle cx="28" cy="58" r="6.5" fill="#d79c86"/>
      <circle cx="100" cy="58" r="13" fill="#7a5a40"/><circle cx="100" cy="58" r="6.5" fill="#d79c86"/>
      <circle cx="64" cy="60" r="38" fill="#8a6848"/>
      <path d="M64 34c-16 0-27 9-27 22 0 9 4 15 9 20 4 4 6 9 18 9s14-5 18-9c5-5 9-11 9-20 0-13-11-22-27-22z" fill="#e3ad97"/>
      <circle cx="51" cy="54" r="9" fill="#06080f"/><circle cx="77" cy="54" r="9" fill="#06080f"/>
      <circle cx="51" cy="54" r="5.5" fill="none" stroke="#E0C15A" stroke-width="2.4"/><circle cx="77" cy="54" r="5.5" fill="none" stroke="#E0C15A" stroke-width="2.4"/>
      <polyline points="44,76 53,76 57,69 62,82 67,72 71,76 84,76" fill="none" stroke="#06080f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-symbolic" viewBox="0 0 16 16">
      <circle cx="3" cy="7.5" r="1.8" fill="#F3F6F9"/><circle cx="13" cy="7.5" r="1.8" fill="#F3F6F9"/>
      <circle cx="8" cy="8" r="5.6" fill="#F3F6F9"/>
      <circle cx="6.2" cy="7" r="1.1" fill="#06080f"/><circle cx="9.8" cy="7" r="1.1" fill="#06080f"/>
      <polyline points="5.2,10.4 6.8,10.4 7.6,9.2 8.4,11.2 9.2,10.4 10.8,10.4" fill="none" stroke="#06080f" stroke-width="1"/>
    </symbol>
    <!-- event glyphs (⇄ ↑ ✕ ↺), drawn as paths so they cost no characters -->
    <symbol id="i-swap" viewBox="0 0 16 16"><path d="M2 5.5h11M10.5 3 13 5.5 10.5 8M14 10.5H3M5.5 8 3 10.5 5.5 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>

  const GK = ['dec', 'pre', 'kv', 'cache', 'req'];

    });

      gap: pat('gp', [el('line', { x1: 0, y1: 0, x2: 0, y2: 7, stroke: C.err, 'stroke-width': 1.4, opacity: .55 })])

    g.append(tx('ahora', { x: CW, y: 262, 'text-anchor': 'end', 'font-size': 11, 'font-weight': 700, fill: C.acc, class: 'ui' }));
    svg.append(g);
    const lg = grp('Leyenda: local 11.4 M, openai-codex 4.4 M, anthropic 2.6 M', []);
    lg.append(tx('18.4M', { x: 642, y: 56, 'text-anchor': 'end', 'font-size': 32, 'font-weight': 700, fill: C.text }));
    names.forEach(function (nm, k) {
      const yy = 104 + k * 50;
      lg.append(sw(466, yy - 11, cols[k]));
      lg.append(tx(nm, { x: 484, y: yy - 1, 'font-size': 12, fill: C.muted, class: 'ui' }));
      lg.append(tx(tot[k] + 'M', { x: 642, y: yy + 8, 'text-anchor': 'end', 'font-size': 20, 'font-weight': 700, fill: C.text }));
    });
    svg.append(lg);
    [['5 h', 38, C.green, 288], ['semana', 61, C.warn, 326]].forEach(function (b) {
      const bg = grp('Ventana Codex ' + b[0] + ': ' + b[1] + ' % usado', []);
      bg.append(tx(b[0], { x: 0, y: b[3] + 8, 'font-size': 12, fill: C.muted, class: 'ui' }));
      bg.append(el('rect', { x: 62, y: b[3], width: 520, height: 8, rx: 4, fill: '#1b1e2a' }));
      bg.append(el('rect', { x: 62, y: b[3], width: 520 * b[1] / 100, height: 8, rx: 4, fill: b[2] }, [ttl(b[1] + ' %')]));
      bg.append(tx(b[1] + ' %', { x: 642, y: b[3] + 9, 'text-anchor': 'end', 'font-size': 14, 'font-weight': 700, fill: C.text }));
      svg.append(bg);
    });
  })();

  // Puertos — strip of 9 cells (NEW: cell strip), ring = Dona
  (function () {
    const svg = document.getElementById('pg-puertos');
    const ports = [
      [22, 'tcp', 'todas', 'ssh · sshd'], [5353, 'udp', 'todas', 'mdns · avahi-daemon'],
      [631, 'tcp', 'local', 'ipp · cupsd'],
      [7420, 'tcp', 'local', 'hermes'], [7600, 'tcp', 'local', 'open-pencil'],
      [9222, 'tcp', 'local', 'chrome devtools'], [11009, 'tcp', 'local', 'router · abito-router'],
      [11012, 'tcp', 'local', 'embed-small · llama-server'], [11070, 'tcp', 'local', 'gufo · llama-server']
    ];
    const hd = grp('7 puertos solo local, 2 en todas las interfaces', []);
    ring(hd, 52, 56, 38, 12, [{ v: 7, c: C.green, t: '7 solo local' }, { v: 2, c: C.warn, t: '2 en todas las interfaces' }], 9);
    hd.append(tx('9', { x: 52, y: 66, 'text-anchor': 'middle', 'font-size': 28, 'font-weight': 700, fill: C.text }));
    hd.append(el('circle', { cx: 130, cy: 46, r: 6, fill: C.green }));
    hd.append(tx('7', { x: 144, y: 53, 'font-size': 24, 'font-weight': 700, fill: C.text }));
    hd.append(el('circle', { cx: 130, cy: 80, r: 6, fill: C.warn }));
    hd.append(tx('2', { x: 144, y: 87, 'font-size': 24, 'font-weight': 700, fill: C.warn }));
    svg.append(hd);
    const cw = 84, ch = 100, gp = 9;
    const cells = grp('9 puertos escuchando, 2 expuestos a todas las interfaces', []);
    ports.forEach(function (p, i) {
      const cx = (i % 5) * (cw + gp), cy = 130 + Math.floor(i / 5) * (ch + gp), ex = p[2] === 'todas', np = p[3] === 'sin proceso';
      const col = ex ? C.warn : C.green;
      const cg = el('g', { transform: 'translate(' + cx + ',' + cy + ')' }, [ttl(p[1].toUpperCase() + ' ' + p[0] + ' · ' + (ex ? 'todas las interfaces' : 'solo local') + ' · ' + p[3])]);
      cg.append(el('rect', { x: .5, y: .5, width: cw - 1, height: ch - 1, rx: 8, fill: ex ? '#15110a' : '#0d0f14', stroke: ex ? C.warn : C.line, 'stroke-width': ex ? 1.5 : 1, 'stroke-dasharray': np ? '4 3' : null }));
      cg.append(el('rect', { x: 10, y: ch - 14, width: cw - 20, height: 4, rx: 2, fill: col, opacity: ex ? 1 : .55 }));
      // TCP = square, UDP = circle
      cg.append(p[1] === 'udp' ? el('circle', { cx: 20, cy: 20, r: 5, fill: 'none', stroke: C.muted, 'stroke-width': 1.5 }) : el('rect', { x: 15, y: 15, width: 10, height: 10, rx: 1.5, fill: 'none', stroke: C.muted, 'stroke-width': 1.5 }));
      if (ex) {
        cg.append(tx(String(p[0]), { x: cw / 2, y: 62, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 700, fill: C.warn }));
      } else {
        cg.append(icon('i-home', cw / 2 - 11, 38, 22, np ? C.dim : C.green));
      }
      cells.append(cg);
    });
    svg.append(cells);
  })();

  // Procesos — horizontal bars of RAM, each with a tiny CPU sparkline (Sparkline widget)
  (function () {
    const svg = document.getElementById('pg-procesos');
    const rows = [['llama-server', 49.2, 312, 3.1], ['firefox', 2.8, 6, 1.2], ['node', 1.9, 3, .8], ['hermes', 1.6, 1, .4], ['gnome-shell', 1.1, 4, 1.4]];
    svg.append(tx('RAM', { x: 130, y: 14, 'font-size': 11, 'font-weight': 700, fill: C.muted, class: 'ui', 'letter-spacing': '.06em' }));
    svg.append(tx('CPU', { x: 520, y: 14, 'font-size': 11, 'font-weight': 700, fill: C.muted, class: 'ui', 'letter-spacing': '.06em' }));
    rows.forEach(function (r, i) {
      const yy = 28 + i * 66, bw = 340 * r[1] / 49.2;
      const rg = grp(r[0] + ': ' + r[1] + ' GiB de RAM, CPU ' + r[2] + ' %', []);
      rg.append(tx(r[0], { x: 0, y: yy + 25, 'font-size': 12.5, fill: C.text, class: 'ui' }));
      rg.append(el('rect', { x: 130, y: yy + 10, width: 340, height: 22, rx: 4, fill: '#12141c' }));
      rg.append(el('rect', { x: 130, y: yy + 10, width: Math.max(4, bw), height: 22, rx: 4, fill: i === 0 ? C.acc : C.sky }, [ttl(r[0] + ' · ' + r[1] + ' GiB')]));
      const lab = r[1] + 'G';
      rg.append(tx(lab, i === 0 ? { x: 130 + bw - 8, y: yy + 26, 'text-anchor': 'end', 'font-size': 14, 'font-weight': 700, fill: '#06080f' } : { x: 130 + bw + 8, y: yy + 26, 'font-size': 14, 'font-weight': 700, fill: C.text }));
      const nz = noise(24, 120 + i, 2), v = nz.map(function (q) { return r[2] * (1 - r[3] * .1) + (q - .5) * r[2] * r[3] * .5; });
      v[23] = r[2];
      const mn = Math.min.apply(null, v), mx = Math.max.apply(null, v), sp = (mx - mn) || 1;
      const sp2 = v.map(function (q, j) { return [520 + j * 122 / 23, yy + 33 - (q - mn) / sp * 24]; });
      rg.append(el('path', { d: 'M' + pts(sp2) + 'L642 ' + (yy + 36) + 'L520 ' + (yy + 36) + 'Z', fill: C.blue, 'fill-opacity': .18 }));
      rg.append(el('path', { d: 'M' + pts(sp2), fill: 'none', stroke: C.blue, 'stroke-width': 1.6, 'stroke-linejoin': 'round' }, [ttl('CPU ' + r[2] + ' %')]));
      rg.append(el('circle', { cx: 642 - 3, cy: sp2[23][1], r: 3.5, fill: C.blue, stroke: C.bg, 'stroke-width': 2 }));
      svg.append(rg);
    });
  })();
})();
</script>
